name: GitHub Release

on:
  push:
    tags:
      - "v*.*.*"
  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v2
    - name: install deps
      run: sudo apt update && sudo apt install -y meson ninja-build tofrodos mingw-w64 mingw-w64-tools libz-mingw-w64-dev
    - name: build
      run: |
        meson setup build-windows --cross-file .github/ubuntu-windows-x86_64.ini
        ninja -C build-windows
    - name: package
      run: |
        mkdir -p iodine-latest-windows/64bit
        echo "Create date: " > iodine-latest-windows/VERSION.txt
        LANG=en_US date >> iodine-latest-windows/VERSION.txt
        echo "Git version: " >> iodine-latest-windows/VERSION.txt
        git rev-parse HEAD >> iodine-latest-windows/VERSION.txt
        for i in README.md CHANGELOG; do cp $i iodine-latest-windows/$i.txt; done
        todos iodine-latest-windows/*.txt
        cp README-win32.txt iodine-latest-windows
        cp build-windows/iodine.exe build-windows/iodined.exe build-windows/wintun.dll iodine-latest-windows/64bit
        cp /usr/x86_64-w64-mingw32/lib/zlib1.dll iodine-latest-windows/64bit
        x86_64-w64-mingw32-strip iodine-latest-windows/64bit/*.exe
        zip -r iodine-latest-windows.zip iodine-latest-windows
    - name: 'Upload Artifact'
      uses: actions/upload-artifact@v3
      with:
        name: iodine-latest-windows.zip
        path: iodine-latest-windows.zip
        retention-days: 5

  build-darwin:

    runs-on: macos-latest

    steps:
    - uses: actions/checkout@v2
    - name: install deps
      run: brew install check meson
    - name: build
      run: |
        meson setup build
        ninja -C build
    - name: run tests
      run: meson test -C build
    - name: 'Upload Artifact'
      uses: actions/upload-artifact@v3
      with:
        name: iodine-latest-macos-amd64
        path: |
          build/iodine
          build/iodined
        retention-days: 5

  build-linux:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v2
    - name: install deps
      run: sudo apt update && sudo apt install -y meson ninja-build
    - name: build
      run: |
        meson setup build
        ninja -C build
    - name: 'Upload Artifact'
      uses: actions/upload-artifact@v3
      with:
        name: iodine-latest-linux-amd64
        path: |
          build/iodine
          build/iodined
        retention-days: 5


  release:
    needs: [build-linux, build-darwin, build-windows]
    runs-on: ubuntu-latest

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v2
      - name: Get tag
        id: tag
        uses: dawidd6/action-get-tag@v1
        with:
          strip_v: true
      - name: Create Draft Release
        id: create_release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{steps.tag.outputs.tag}}
          release_name: ${{steps.tag.outputs.tag}}
          draft: true
          prerelease: false
      - name: Create Zip
        run: |
          zip -r iodine-latest-macos-amd64.zip iodine-latest-macos-amd64/*
          zip -r iodine-latest-linux-amd64.zip iodine-latest-linux-amd64/*
      - uses: actions/upload-release-asset@v1.0.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: ./iodine-latest-windows.zip/iodine-latest-windows.zip
          asset_name: iodine-latest-windows.zip
          asset_content_type: application/zip
      - uses: actions/upload-release-asset@v1.0.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: ./iodine-latest-linux-amd64.zip
          asset_name: iodine-latest-linux-amd64.zip
          asset_content_type: application/zip
      - uses: actions/upload-release-asset@v1.0.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: ./iodine-latest-macos-amd64.zip
          asset_name: iodine-latest-macos-amd64.zip
          asset_content_type: application/zip

      - uses: eregon/publish-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          release_id: ${{ steps.create_release.outputs.id }}
